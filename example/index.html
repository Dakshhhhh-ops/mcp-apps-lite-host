<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcp-apps-lite-host example</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; font: 15px/1.5 system-ui, sans-serif; background: #0b1220; color: #e8eefc; }
  .card { max-width: 560px; border: 1px solid #22304d; border-radius: 16px; padding: 12px; background: #0f1830; }
  pre { background: #08101f; padding: 12px; border-radius: 10px; font-size: 12px; max-height: 260px; overflow: auto; }
</style>
</head>
<body>
<h1>mcp-apps-lite-host</h1>
<p>A fake tool result rendered by an MCP Apps view. The view's button calls a tool through the host.</p>
<div class="card" id="slot"></div>
<h3>Protocol log</h3>
<pre id="log"></pre>

<script type="module">
import { McpAppHost } from "../mcp-apps-host.js";

// A minimal MCP Apps view. In real use this HTML comes from resources/read on a ui:// URI.
const VIEW = `<!doctype html><meta charset="utf-8">
<body style="font:16px system-ui;color:#fff;margin:0;padding:12px">
<div id="out">Waiting for the tool result…</div>
<button id="b" style="margin-top:10px">Mark taken</button>
<script>
let id = 0; const pending = {};
const send = (method, params) => new Promise(r => { const i = ++id; pending[i] = r; parent.postMessage({jsonrpc:"2.0", id:i, method, params}, "*"); });
const notify = (method, params) => parent.postMessage({jsonrpc:"2.0", method, params}, "*");
addEventListener("message", e => {
  const m = e.data;
  if (m.id && pending[m.id]) { pending[m.id](m.result ?? m.error); delete pending[m.id]; return; }
  if (m.method === "ui/notifications/tool-result") {
    document.getElementById("out").textContent = m.params.structuredContent.speech;
    notify("ui/notifications/size-changed", { height: document.body.scrollHeight });
  }
});
document.getElementById("b").onclick = async () => {
  const r = await send("tools/call", { name: "log_medication", arguments: { medication: "metformin" } });
  document.getElementById("out").textContent = r.structuredContent.speech;
};
send("ui/initialize", { appInfo: { name: "demo-view", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" })
  .then(() => notify("ui/notifications/initialized", {}));
<\/script>`;

const log = (entry) => {
  document.getElementById("log").textContent += `${entry.dir}  ${JSON.stringify(entry.msg)}\n`;
};

new McpAppHost({
  container: document.getElementById("slot"),
  html: VIEW,
  tool: { name: "get_today" },
  toolInput: {},
  toolResult: { content: [], structuredContent: { speech: "Metformin is due at 6 PM." } },
  // In a real host, forward this to your MCP client: client.callTool(name, args)
  callTool: async (name, args) => ({ content: [], structuredContent: { speech: `Logged ${args.medication} as taken.` } }),
  onLog: log,
  maxHeight: 400,
}).mount();
</script>
</body>
</html>
