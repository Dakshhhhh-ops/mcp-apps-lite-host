<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>MCP Apps sandbox proxy</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  iframe { display: block; width: 100%; height: 100%; border: 0; background: transparent; color-scheme: inherit; }
</style>
</head>
<body>
<script type="module">
/*
 * Sandbox proxy for mcp-apps-lite-host: the double-iframe setup the MCP Apps spec
 * requires for web hosts.
 *
 *   host page (your origin) -> this proxy (sandbox origin) -> the view (inner iframe)
 *
 * Deploy this file and mcp-apps-host.js together on an origin that is NOT your app's
 * origin (for example https://sandbox.example.com), add your app's origin to
 * ALLOWED_HOSTS, and pass the proxy URL to `new McpAppHost({ sandboxProxy })`.
 */
import { buildAllow, buildCsp, injectCsp } from "./mcp-apps-host.js";

// Origins allowed to embed this proxy: exact strings or regular expressions. Edit for production.
const ALLOWED_HOSTS = [/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?$/];

const SANDBOX_PREFIX = "ui/notifications/sandbox-";
const fail = (why) => {
  throw new Error(`[sandbox-proxy] ${why}`);
};

if (window.self === window.top) fail("load this page in an iframe");
const HOST = document.referrer ? new URL(document.referrer).origin : "";
if (!ALLOWED_HOSTS.some((a) => (typeof a === "string" ? a === HOST : a.test(HOST)))) {
  fail(`embedding origin not allowed: ${HOST || "(no referrer)"}`);
}
if (HOST === location.origin) fail("the host page and the sandbox must be on different origins");
try {
  void window.top.document; // must throw: the top page has to be cross-origin
  fail("the top page is same-origin with the sandbox");
} catch (e) {
  if (String(e?.message).startsWith("[sandbox-proxy]")) throw e;
}

const inner = document.createElement("iframe");
inner.setAttribute("title", "MCP App");
let loaded = false;
let sameOrigin = false;

/** Apply the view's CSP to this page too, so a same-origin view can't use the proxy to get around it. */
function lockDown(policy) {
  const meta = document.createElement("meta");
  meta.httpEquiv = "Content-Security-Policy";
  meta.content = policy;
  document.head.prepend(meta);
}

function load(params) {
  if (loaded) return; // one view per proxy
  loaded = true;
  const p = params && typeof params === "object" ? params : {};
  const sandbox = typeof p.sandbox === "string" ? p.sandbox : "allow-scripts allow-same-origin allow-forms";
  sameOrigin = /(^|\s)allow-same-origin(\s|$)/.test(sandbox);
  const policy = buildCsp(p.csp);
  lockDown(policy);
  inner.setAttribute("sandbox", sandbox);
  const allow = buildAllow(p.permissions);
  if (allow) inner.setAttribute("allow", allow);
  inner.srcdoc = injectCsp(typeof p.html === "string" ? p.html : "", policy);
  document.body.appendChild(inner);
}

window.addEventListener("message", (ev) => {
  const m = ev.data;
  const method = typeof m?.method === "string" ? m.method : "";
  if (ev.source === window.parent) {
    if (ev.origin !== HOST) return;
    if (method === `${SANDBOX_PREFIX}resource-ready`) return load(m.params);
    if (method.startsWith(SANDBOX_PREFIX)) return;
    inner.contentWindow?.postMessage(m, sameOrigin ? location.origin : "*");
  } else if (inner.contentWindow && ev.source === inner.contentWindow) {
    if (ev.origin !== (sameOrigin ? location.origin : "null")) return;
    if (method.startsWith(SANDBOX_PREFIX)) return; // the view can't speak for the proxy
    window.parent.postMessage(m, HOST);
  }
});

window.parent.postMessage({ jsonrpc: "2.0", method: `${SANDBOX_PREFIX}proxy-ready`, params: {} }, HOST);
</script>
</body>
</html>
